# starter_v0 — tool declarations.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại khi thiếu thông tin thiết yếu. Dùng response_type=text để xin thông tin; dùng response_type=yes_no để xác nhận riêng một hành động có side effect như gửi hoặc đăng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Dùng yes_no để hỏi xác nhận hành động gửi/đăng; dùng text để xin thông tin còn thiếu; dùng choice khi cần chọn trong options."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây từ một tài khoản X cụ thể. Chỉ dùng khi người dùng nêu tài khoản; không dùng để tìm bài theo chủ đề."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle X không có ký tự @; phải được người dùng cung cấp."}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên X theo chủ đề hoặc từ khóa. Dùng khi người dùng hỏi về tweet/bài đăng theo chủ đề; nếu yêu cầu cả web và X thì gọi cùng lookup."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/từ khóa ngắn gọn; không chép cả yêu cầu hoặc tự thêm từ liên quan."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm thông tin trên web, gồm tin tức. Dùng topic=news cho tin thời sự; dùng timeframe=day khi người dùng nói hôm nay. Nếu người dùng cũng yêu cầu bài đăng X, gọi thêm social_search."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề/từ khóa ngắn gọn, ví dụ AI; không chép cả yêu cầu hoặc tự thêm từ liên quan. Đặt loại tin và thời gian ở topic/timeframe."}
        topic: {type: string, enum: [general, news], default: "general", description: "Dùng news cho tin tức/thời sự; general cho tra cứu web thông thường."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=hôm nay/24 giờ, week=tuần, month=tháng, year=năm."}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ URL cụ thể do người dùng cung cấp; không dùng để tìm kiếm và không tự đoán URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung lên Telegram. Không gọi chỉ vì người dùng yêu cầu gửi: trước tiên hỏi xác nhận riêng bằng clarify(response_type=yes_no), rồi chỉ gọi send với confirmed=true sau khi người dùng đồng ý rõ ràng ở lượt sau."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Chỉ true sau khi người dùng đã trả lời đồng ý với câu hỏi xác nhận yes/no ở lượt trước."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
      
  - name: text_cleaner
    description: "Chuyển HTML hoặc Markdown thành văn bản thuần."
    parameters:
      type: object
      properties:
        text:
          type: string
          description: "Nội dung HTML hoặc Markdown cần làm sạch, không phải URL."
      required: [text]